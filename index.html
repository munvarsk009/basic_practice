<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; color: #172033;
      background: linear-gradient(135deg, #dbeafe, #f5eaff);
    }
    .card {
      width: min(100%, 560px); padding: 48px 32px; text-align: center;
      background: white; border-radius: 20px;
      box-shadow: 0 16px 45px rgba(31, 41, 55, 0.12);
    }
    .tag { color: #5365d8; font-size: 12px; font-weight: bold; letter-spacing: 2px; }
    h1 { margin: 16px 0; font-size: clamp(30px, 6vw, 42px); }
    .intro { color: #5b6475; line-height: 1.6; }
    button {
      margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 10px;
      color: white; background: #5365d8; font-size: 16px; cursor: pointer;
    }
    button:hover { background: #3f50bd; }
    #message { min-height: 24px; margin-top: 18px; color: #28734b; font-weight: bold; }
  </style>
</head>
<body>
  <main class="card">
    <p class="tag">MY FIRST WEBSITE</p>
    <h1>Hello, GitHub Pages! 👋</h1>
    <p class="intro">This website uses HTML, CSS and JavaScript in one file.</p>
    <button id="helloButton">Click me</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById("helloButton").addEventListener("click", function () {
      document.getElementById("message").textContent =
        "Your website is working. Great job!";
    });
  </script>
</body>
</html>
